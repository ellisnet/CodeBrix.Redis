port 0
tls-port 6384
timeout 0
protected-mode no
tls-auth-clients no
tls-ciphers ECDHE-RSA-AES256-GCM-SHA384
tls-ciphersuites TLS_AES_256_GCM_SHA384
tls-protocols "TLSv1.2 TLSv1.3"
tls-cert-file /certs/redis.crt
tls-key-file /certs/redis.key
tls-ca-cert-file /certs/ca.crt
# AKE is upstream's value; STIV adds the sub-keyspace notification classes
# (S sub-keyspace, T sub-keyevent, I sub-keyspace-item, V sub-keyspace-event),
# which redis:8-alpine (8.10.1) accepts and which ~44 tests in
# PubSubKeyNotificationTests/ArrayTests skip without. See MAINTAINER-README.txt.
notify-keyspace-events AKESTIV
dir /data
save ""
